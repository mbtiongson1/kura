[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kura-media"
version = "0.1.0"
description = "Headless Termux media acquisition CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kura = "kura.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
